<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de gorjetas</title>
</head>

<body>

    <header>
        <h1>Calculadora de gorjetas</h1>
        <p>Calculadora desenvolvida para facilitar o cálculo de gorjetas em restaurantes, bares e serviços.</p>
    </header>

    <main>

        <section>
            <h2>Área de cálculo</h2>

            <label for="valor">Valor total(R$):</label>
            <input id="valor" name="valor" type="number" placeholder="Ex: 330.99" required>

            <label for="porcentagem">Porcentagem (%):</label>
            <input id="porcentagem" name="porcentagem" type="number" placeholder="Ex: 10" required>

            <button type="button" onclick="calcular()">Calcular</button>
            <button type="button" onclick="limparCampos()">Limpar campos</button>
        </section>

        <section>
            <h2>Resultado</h2>
            <p id="conta"></p>
            <p id="gorjeta"></p>
            <p id="total"></p>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
